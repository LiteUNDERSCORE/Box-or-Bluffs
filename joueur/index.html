<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box of Bluffs – Joueur</title>
<link rel="stylesheet" href="../commun/style.css?v=3">
</head>
<body>
<div class="bandeau"></div>
<h1>Box of <span>Bluffs</span></h1>
<p class="sous">Espace joueur</p>
<div id="modeLocal" class="mode-local cache">Mode test local : Firebase n'est pas encore configuré.</div>

<section id="vueRejoindre">
  <div class="panneau">
    <h2>Rejoindre une partie</h2>
    <label for="code">Code</label>
    <input id="code" maxlength="4" placeholder="ABCD" autocapitalize="characters">
    <label for="pseudo">Pseudo</label>
    <input id="pseudo" maxlength="20" placeholder="Ton pseudo">
    <button id="rejoindre">Rejoindre</button>
    <p id="erreur" class="erreur"></p>
  </div>
</section>

<section id="vueJeu" class="cache">
  <div class="panneau">
    <h2 id="titreManche">Partie</h2>
    <div class="scores" id="scores"></div>
  </div>
  <div class="panneau">
    <p class="message" id="message"></p>
    <div class="scene" id="scene"></div>
    <div class="choix cache" id="boutons"></div>
  </div>
  <div class="panneau">
    <h2>Ma collection</h2>
    <ul class="collection" id="collection"></ul>
  </div>
</section>

<script type="module">
import { initDb } from "../commun/db.js";
import * as J from "../commun/jeu.js";
import { boiteHtml } from "../commun/ui.js";

const $ = (id) => document.getElementById(id);
const E = J.echapper;
const db = await initDb();
if (db.mode === "local") $("modeLocal").classList.remove("cache");

const params = new URLSearchParams(location.search);
if (params.get("code")) $("code").value = params.get("code").toUpperCase();

let code = null, moi = null, partie = null, envoi = false;

async function rejoindre() {
  const c = $("code").value.trim().toUpperCase();
  const nom = $("pseudo").value.trim();
  $("erreur").textContent = "";
  if (!nom) { $("erreur").textContent = "Choisis un pseudo."; return; }
  if (!(await db.lire(`parties/${c}`))) { $("erreur").textContent = "Aucune partie avec ce code."; return; }
  let place = null;
  const r = await db.transaction(`parties/${c}/joueurs`, (joueurs) => {
    joueurs = joueurs || {};
    place = !joueurs.j1 ? "j1" : !joueurs.j2 ? "j2" : null;
    if (!place) return undefined; // partie pleine : on annule
    joueurs[place] = { nom, points: 0 };
    return joueurs;
  });
  if (!r.ok || !place) { $("erreur").textContent = "La partie est déjà complète."; return; }
  entrer(c, place);
}

function entrer(c, id) {
  code = c; moi = id;
  try { sessionStorage.setItem("bob-joueur", JSON.stringify({ code, moi })); } catch {}
  $("vueRejoindre").classList.add("cache");
  $("vueJeu").classList.remove("cache");
  db.ecouter(`parties/${c}`, (p) => { partie = p; envoi = false; if (p) afficher(); });
}

const nomDe = (id) => (partie.joueurs && partie.joueurs[id] && partie.joueurs[id].nom) || "Adversaire";

function boutons(liste) {
  const zone = $("boutons");
  zone.innerHTML = "";
  zone.classList.toggle("cache", liste.length === 0);
  for (const [texte, action, classe] of liste) {
    const b = document.createElement("button");
    b.textContent = texte;
    if (classe) b.className = classe;
    b.onclick = action;
    zone.appendChild(b);
  }
}

function afficher() {
  const p = partie, adv = J.AUTRE[moi];
  const jePorte = p.porteur === moi;
  $("titreManche").textContent = p.manche ? `Manche ${p.manche} / ${p.nbManches}` : "Partie " + code;
  $("scores").innerHTML = [moi, adv].map((id) => `
    <div class="score ${id === moi ? "moi" : ""}"><div class="nom">${E(id === moi ? nomDe(moi) + " (toi)" : (p.joueurs && p.joueurs[id] ? nomDe(id) : "En attente…"))}</div>
    <div class="pts">${J.score(p, id)} pt${J.score(p, id) > 1 ? "s" : ""}</div></div>`).join("");

  let msg = "", scene = "", bts = [];
  if (p.etat === "attente") {
    msg = J.joueursPrets(p) ? "Tout le monde est là, l'organisateur va lancer la partie…" : "En attente de ton adversaire…";
  } else if (p.etat === "annonce") {
    if (jePorte) {
      msg = `À toi ! Regarde ta boîte et improvise : raconte à ${E(nomDe(adv))} ce qu'il y a dedans… ou pas 😏<br><span class="info">Puis indique en secret si tu dis vrai ou si tu bluffes.</span>`;
      scene = boiteHtml(p, true);
      bts = [["Je dis vrai", () => agir(J.declarer(p, true))], ["Je bluffe", () => agir(J.declarer(p, false)), "vide-btn"]];
    } else {
      msg = `${E(nomDe(adv))} ouvre sa boîte et improvise… écoute bien.`;
      scene = boiteHtml(p, false);
    }
  } else if (p.etat === "choix") {
    if (jePorte) {
      msg = `Tu as choisi : <span class="badge ${p.verite ? "gris" : ""}">${p.verite ? "vérité" : "bluff"}</span><br>${E(nomDe(adv))} décide si tu dis vrai…`;
      scene = boiteHtml(p, true);
    } else {
      msg = `${E(nomDe(adv))} a fini son annonce. Vrai ou faux ?`;
      scene = boiteHtml(p, false);
      bts = [["Vrai", () => agir(J.deviner(p, "vrai"))], ["Faux", () => agir(J.deviner(p, "faux")), "vide-btn"]];
    }
  } else if (p.etat === "revelation" && p.resultat) {
    const r = p.resultat, gagne = r.gagnant === moi;
    const verdict = p.verite ? "disait vrai" : "bluffait";
    const quiParle = jePorte ? "Tu" : E(nomDe(adv));
    msg = (gagne ? "Bien joué ! " : "Perdu… ") + `${quiParle} ${jePorte ? (p.verite ? "disais vrai" : "bluffais") : verdict}. `
      + (gagne ? "+1 point pour toi" : `+1 point pour ${E(nomDe(adv))}`)
      + (r.carte != null ? ` et la carte « ${E(p.cartes[r.carte])} »` : "") + ".";
    scene = boiteHtml(p, true);
  } else if (p.etat === "fin") {
    const v = J.vainqueur(p);
    msg = v === null ? "Partie terminée : égalité !" : v === moi ? `Victoire ! Tu gagnes avec ${J.score(p, moi)} points 🏆` : `Partie terminée : ${E(nomDe(v))} gagne.`;
  }
  $("message").innerHTML = msg;
  $("scene").innerHTML = scene;
  boutons(bts);

  $("collection").innerHTML = J.collection(p, moi).map((c) => `<li><span>${E(p.cartes[c])}</span></li>`).join("")
    || '<li class="info">Rien pour l\'instant</li>';
}

async function agir(maj) {
  if (envoi) return;
  envoi = true;
  try { await db.mettreAJour(`parties/${code}`, maj); }
  catch (e) { envoi = false; alert(e.message); }
}

$("rejoindre").onclick = rejoindre;

// Retour dans la partie après un rechargement de la page
try {
  const s = JSON.parse(sessionStorage.getItem("bob-joueur"));
  if (s && (!params.get("code") || params.get("code").toUpperCase() === s.code)) {
    const p = await db.lire(`parties/${s.code}`);
    if (p && p.joueurs && p.joueurs[s.moi]) entrer(s.code, s.moi);
  }
} catch {}
</script>
</body>
</html>
